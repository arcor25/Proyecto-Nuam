<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso · Mantenedor nuam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm" style="width: 22rem;">
        <div class="card-header text-white fw-bold" style="background-color: #1C4E80;">
            Mantenedor de Calificaciones Tributarias
        </div>
        <div class="card-body">
            <form method="post" action="{% url 'login' %}" novalidate>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ siguiente }}">

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Correo electrónico</label>
                    <input id="email" type="email" name="email" class="form-control" value="{{ email }}" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold">Contraseña</label>
                    <input id="password" type="password" name="password" class="form-control" required>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
                {% endif %}

                <button type="submit" class="btn w-100 text-white fw-bold" style="background-color: #1C4E80;">INGRESAR</button>
            </form>
        </div>
    </div>
</body>
</html>
